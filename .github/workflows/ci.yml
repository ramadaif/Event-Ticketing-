name: C++ CI Pipeline

on:
  push:
    branches: [main, dev, "feature/*"]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - run: sudo apt-get update && sudo apt-get install -y g++ cmake

      - run: |
          mkdir build
          cd build
          cmake ..
          make

      - run: |
          cd build
          ctest
